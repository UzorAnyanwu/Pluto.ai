name: CI

# Runs on every PR and on every push to main. This is the "on PR" half of the pipeline described
# in docs/architecture/05-infra-and-observability.md §3: lint, type-check, unit+integration
# tests, dependency/container scan, and (for infra changes) a Terraform plan posted to the PR —
# never applied here. The deploy pipeline (deploy.yml) only starts after this is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-typecheck:
    name: Lint & type-check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/pluto_core -e services/api-core
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: ruff check
        run: ruff check libs/pluto_core services/api-core

      - name: ruff format --check
        run: ruff format --check libs/pluto_core services/api-core

      - name: mypy
        run: mypy libs/pluto_core/pluto_core services/api-core/app

  test:
    name: Test (pytest, real Postgres+Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled image — see infra/docker/docker-compose.yml for why we don't use plain
        # `postgres:16` and bolt the extension on separately.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pluto_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pluto_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/pluto_ai_test
      DATABASE_URL: postgresql+asyncpg://pluto_app:pluto_app_ci_password@localhost:5432/pluto_ai_test
      REDIS_URL: redis://localhost:6379/0
      JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/secrets/jwt_public_key.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/pluto_core -e services/api-core
          pip install pytest pytest-asyncio httpx psycopg[binary]

      - name: Generate a throwaway JWT keypair for this run
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt_private_key.pem
          openssl rsa -pubout -in secrets/jwt_private_key.pem -out secrets/jwt_public_key.pem

      - name: Bootstrap the least-privilege pluto_app role
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -d pluto_ai_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U postgres -d pluto_ai_test -c \
            "CREATE ROLE pluto_app LOGIN PASSWORD 'pluto_app_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -d pluto_ai_test -c "GRANT CONNECT ON DATABASE pluto_ai_test TO pluto_app;"
          psql -h localhost -U postgres -d pluto_ai_test -c "GRANT USAGE ON SCHEMA public TO pluto_app;"

      - name: Run migrations (up, then down, then up — a migration that doesn't reverse
          cleanly fails here, per docs/product/03-technical-specifications.md §8)
        working-directory: libs/pluto_core
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        working-directory: services/api-core
        run: pytest tests/ -v

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e libs/pluto_core -e services/api-core
          pip-audit --strict

  terraform-plan:
    name: Terraform plan (infra changes only, never applied here)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this PR touches infra/terraform
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'

      - uses: hashicorp/setup-terraform@v3
        if: steps.changed.outputs.terraform == 'true'
        with:
          terraform_version: "1.9.8"

      # Least-privilege, short-lived credentials via GitHub OIDC — no long-lived AWS access keys
      # stored as repo secrets. See docs/architecture/04-security-and-compliance.md §5.
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changed.outputs.terraform == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        if: steps.changed.outputs.terraform == 'true'
        run: terraform init

      - name: terraform validate
        if: steps.changed.outputs.terraform == 'true'
        run: terraform validate

      - name: terraform plan
        if: steps.changed.outputs.terraform == 'true'
        run: terraform plan -no-color -input=false
        continue-on-error: true
        id: plan

      - name: Post plan to PR
        if: steps.changed.outputs.terraform == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (\`dev\` environment)
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
