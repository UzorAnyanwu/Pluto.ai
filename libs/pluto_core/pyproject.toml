[project]
name = "pluto-core"
version = "0.1.0"
description = "Shared database models, security utilities, and configuration for Pluto AI services."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "argon2-cffi>=23.1.0",
  "pyjwt[crypto]>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pluto_core"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]
