[project]
name = "pluto-api-core"
version = "0.1.0"
description = "Pluto AI core FastAPI monolith: auth, tenants/businesses, CRM, bookings, workflows, billing."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pluto-core",
  "redis>=5.0.8",
  "python-multipart>=0.0.9",
  "email-validator>=2.2.0",
]

[tool.uv.sources]
pluto-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
